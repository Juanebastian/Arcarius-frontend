<div class="bg-container flex flex-col justify-between min-h-screen">
  <!-- Contenedor principal -->
  <div class="flex flex-1 items-center justify-center px-4">
    <div
      class="w-full max-w-md bg-white/30 backdrop-blur-lg rounded-3xl shadow-2xl p-10 transform transition duration-500 hover:scale-[1.02] hover:shadow-3xl"
    >
      <!-- Logo -->
      <div class="flex justify-center mb-6">
        <img src="images/logo_rt.png" alt="Logo" class="h-20 drop-shadow-lg" />
      </div>

      <h2 class="text-3xl font-bold text-center text-blue-1000 mb-6">
        Iniciar Sesión
      </h2>

      <!-- Formulario -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="mb-5">
          <label class="block text-sm font-medium text-blue-1000 mb-2"
            >Correo electrónico</label
          >
          <input
            type="email"
            formControlName="email"
            placeholder="ejemplo@correo.com"
            class="w-full px-4 py-3 rounded-xl bg-white text-gray-900 placeholder-gray-400 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm transition"
          />
          <div
            *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid"
            class="text-red-600 text-sm mt-1"
          >
            <span *ngIf="loginForm.get('email')?.errors?.['required']"
              >El correo es obligatorio.</span
            >
            <span *ngIf="loginForm.get('email')?.errors?.['email']"
              >Formato de correo inválido.</span
            >
          </div>
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label class="block text-sm font-medium text-blue-1000 mb-2"
            >Contraseña</label
          >
          <input
            type="password"
            formControlName="password"
            placeholder="••••••••"
            class="w-full px-4 py-3 rounded-xl bg-white text-gray-900 placeholder-gray-400 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-600 shadow-sm transition"
          />
          <div
            *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
            class="text-red-600 text-sm mt-1"
          >
            <span *ngIf="loginForm.get('password')?.errors?.['required']"
              >La contraseña es obligatoria.</span
            >
          </div>
        </div>

        <!-- Mensaje de error global -->
        <div *ngIf="errorMsg" class="mb-4 text-red-600 text-center">
          {{ errorMsg }}
        </div>

        <!-- Botón -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full py-3 rounded-xl bg-gradient-to-r from-blue-800 to-blue-800 text-white font-semibold hover:from-blue-900 hover:to-blue-700 transform hover:scale-[1.02] transition-all duration-300 shadow-lg flex items-center justify-center"
        >
          <span *ngIf="!loading">Entrar</span>
          <span *ngIf="loading" class="flex items-center">
            <svg
              class="animate-spin h-5 w-5 mr-2 text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
              ></path>
            </svg>
            Cargando...
          </span>
        </button>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer
    class="bg-blue-900 text-white text-center py-4 border-t border-blue-800/50"
  >
    <p class="text-sm">&copy; 2025 ARCARIUS. Todos los derechos reservados.</p>
  </footer>
</div>
